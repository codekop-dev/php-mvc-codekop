# Codekop benchmark — Apache2 as a reverse proxy to php-fpm (127.0.0.1:9000).
# Root .htaccess still provides the front-controller rewrite + deny rules;
# only PHP execution is handed off to FPM instead of mod_php.
ServerName codekop-bench.local

<VirtualHost *:80>
    ServerName codekop-bench.local
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:fcgi://127.0.0.1:9000"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/codekop-error.log
    CustomLog ${APACHE_LOG_DIR}/codekop-access.log combined
</VirtualHost>
