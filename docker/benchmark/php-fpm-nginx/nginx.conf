# Codekop benchmark — Nginx + php-fpm (127.0.0.1:9000).
# Adapted from nginx.conf.example, same deny/rewrite rules.
server {
    listen 80 default_server;
    server_name _;

    root /var/www/html;
    index index.php;

    client_max_body_size 20m;
    autoindex off;

    location ~* ^/(?:app|system|storage|database|vendor|\.git|\.agents|\.codex)(?:/|$) {
        return 404;
    }

    location ~* /\.(?!well-known/) {
        return 404;
    }

    location ~* \.(?:env|ini|log|sql|bak|dist|fla|psd|sh)$ {
        return 404;
    }

    location ~* ^/assets/.*\.(?:php[0-9]?|phtml|phar|cgi|pl|py|sh)$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass 127.0.0.1:9000;
    }

    location ~ \.php$ {
        return 404;
    }
}
